<title>Тайна Коэлета</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Onest:wght@400;500;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<style>
/* Layout: one-column game frame (max 760px), sticky HUD, one task per screen, answers as a grid of cards.
   World: a daylight sukkah — sage-mint ground, white cards, sechach green, etrog gold, pomegranate. Deliberately single light theme; the library and the sky stay as painted scenes. */
:root{
  --bg:#edf3ef; --sunk:#e1ebe5; --panel:#ffffff; --panel-2:#f5faf7; --line:#cfddd5;
  --ink:#17282e; --muted:#566d67; --leaf:#2f7d4a; --etrog:#a2700a; --gold:#f2be3d; --gold-edge:#c9951f; --pome:#c8445b; --sky:#3d7fb0;
  --etrog-ink:#2a2004; --leaf-soft:rgba(47,125,74,.10); --etrog-soft:rgba(242,190,61,.20); --pome-soft:rgba(200,68,91,.09);
  --shadow:0 14px 30px -20px rgba(23,40,46,.45);
  --display:"Unbounded","Trebuchet MS",system-ui,sans-serif;
  --body:"Onest","Segoe UI",system-ui,sans-serif;
  --hebrew:"Frank Ruhl Libre","David","Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60% 40% at 85% 0%,rgba(242,190,61,.18),transparent 70%),radial-gradient(50% 40% at 0% 100%,rgba(47,125,74,.10),transparent 70%)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--etrog);outline-offset:3px}
.app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-inline:16px;padding-block:10px 48px;display:flex;flex-direction:column;gap:16px;min-height:100%}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{font-family:var(--display);font-weight:700;font-size:13px}
.pill .spark{width:10px;height:10px;background:var(--gold);transform:rotate(45deg);border-radius:2px}
.hud .grow{flex:1}
.iconbtn{min-height:40px;min-width:40px;border-radius:999px;background:var(--panel);border:1px solid var(--line);padding:6px 12px;font-size:13px}
.lvl{display:flex;flex-direction:column;gap:3px;min-width:96px}
.lvl small{font-size:11px;color:var(--muted);letter-spacing:.04em}
.bar{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:9px;transition:width .6s ease}

/* Type */
.kicker{font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--etrog)}
.h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,54px);line-height:1.02;letter-spacing:-.01em;margin:0;text-wrap:balance}
.h2{font-family:var(--display);font-weight:700;font-size:clamp(21px,5vw,28px);line-height:1.15;margin:0;text-wrap:balance}
.lead{font-size:18px;color:var(--muted);margin:0;max-width:34em}
p{margin:0}
.muted{color:var(--muted)}
.heb{font-family:var(--hebrew);direction:rtl;unicode-bidi:isolate}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:14px 26px;border-radius:16px;border:0;background:var(--gold);color:var(--etrog-ink);font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.01em;box-shadow:0 6px 0 -1px var(--gold-edge);transition:transform .15s ease,box-shadow .15s ease}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 -1px var(--gold-edge)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none;font-family:var(--body);font-weight:500;font-size:15px;min-height:48px}
.btn.small{min-height:44px;padding:10px 16px;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.actions .btn:not(.ghost){flex:1 1 220px}

/* Scene */
.scene{display:flex;flex-direction:column;gap:18px;animation:rise .45s ease both}
.scene-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dots{display:flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--etrog)}
.dots i.done{background:var(--leaf)}
.say{display:grid;grid-template-columns:68px minmax(0,1fr);gap:12px;align-items:start}
.say .av{width:68px;height:68px;border-radius:22px;overflow:hidden;background:var(--panel-2);animation:pop .4s ease both}
.bubble{background:var(--panel);border:1px solid var(--line);border-radius:6px 20px 20px 20px;padding:14px 18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);animation:rise .4s .1s ease both}
.who{font-family:var(--display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--etrog)}
.bubble .txt{font-size:18px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.opts.compact{grid-template-columns:repeat(auto-fill,minmax(min(46%,160px),1fr))}
.opt{display:flex;flex-direction:row;align-items:center;gap:12px;text-align:left;width:100%;min-width:0;min-height:64px;padding:12px 14px;border-radius:18px;background:var(--panel);border:1.5px solid var(--line);box-shadow:var(--shadow);transition:border-color .2s,background .2s,opacity .3s,transform .15s}
.opt:hover:not([disabled]){border-color:var(--etrog)}
.opt:active:not([disabled]){transform:scale(.99)}
.opt small{display:block;color:var(--muted);font-size:14px}
.opt .ic{flex:none;width:42px;height:42px;border-radius:14px;background:var(--sunk);display:grid;place-items:center;font-size:21px;font-family:var(--display);font-weight:700;font-size:15px;color:var(--leaf)}
.opt .ic.e{font-size:22px}
.opt .ot{min-width:0;display:flex;flex-direction:column;gap:2px}
.opts.compact .opt{flex-direction:column;align-items:flex-start;gap:8px;min-height:104px}
.opt.picked .ic{background:var(--gold);color:var(--etrog-ink)}
.opt.picked{border-color:var(--etrog);background:var(--panel-2)}
.opt.dim{opacity:.38}
.opt[disabled]{cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:10px 16px;border-radius:999px;background:var(--panel);border:1.5px solid var(--line);font-size:16px;transition:all .2s}
.chip.on{background:var(--leaf);border-color:var(--leaf);color:#fff;font-weight:600}
.resp{background:var(--leaf-soft);border:1px solid rgba(47,125,74,.3);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;animation:rise .4s ease both}
.resp .who{color:var(--leaf)}
.hint{background:var(--etrog-soft);border:1px dashed var(--gold-edge);border-radius:14px;padding:12px 16px;font-size:15px;animation:rise .3s ease both}
.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.card p+p{margin-top:2px}
.bigheb{font-family:var(--hebrew);font-size:clamp(40px,11vw,68px);line-height:1.1;color:var(--pome);text-align:center;direction:rtl}
.quote-he{font-family:var(--hebrew);font-size:clamp(26px,6.5vw,38px);line-height:1.35;direction:rtl;text-align:right;color:var(--pome)}
.src{font-size:13px;color:var(--muted);letter-spacing:.04em}
.reveal{padding:34px 22px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.reveal .h1{font-size:clamp(26px,6.5vw,42px)}
.reveal .line{width:0;height:4px;border-radius:4px;background:var(--gold);animation:grow 1s .3s ease forwards}
.stat{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:15px}
.stat .bar{height:10px}
.stat .bar i{background:var(--gold);width:0;animation:fill 1.2s ease forwards}

/* Title */
.title-screen{display:flex;flex-direction:column;gap:22px;padding-block:18px 10px}
.title-screen .h1{font-size:clamp(40px,12vw,84px)}
.title-screen .h1 span{color:var(--pome)}
.puzzlewall{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:520px;width:100%}
.puzzlewall svg{width:100%;height:auto;display:block}
.pw-hole path{fill:none!important;stroke:var(--etrog)!important;stroke-width:3!important;stroke-dasharray:7 6;animation:dash 6s linear infinite}
.foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

/* Create */
.create{display:grid;gap:18px}
.create-top{display:grid;grid-template-columns:132px minmax(0,1fr);gap:18px;align-items:center}
.create-top .preview{width:132px;height:132px;border-radius:36px;overflow:hidden;background:var(--panel-2);border:2px solid var(--etrog)}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font-size:18px;padding:10px 14px}
.group{display:flex;flex-direction:column;gap:10px}
.group h3{margin:0;font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.archs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.arch{padding:10px 6px;border-radius:16px;background:var(--panel);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;text-align:center}
.arch svg{width:58px;height:58px;border-radius:16px;background:var(--panel-2)}
.arch.on,.sw.on{border-color:var(--etrog);background:var(--panel-2)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:56px;height:56px;border-radius:16px;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0}
.sw span{width:34px;height:34px;border-radius:50%;display:block}
.idcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.segb{min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);font-size:15px;font-weight:500;padding:8px 6px}
.segb.on{border-color:var(--etrog);background:var(--etrog-soft);font-weight:700}
.agenote{font-size:14px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:10px 14px}

/* Own words, what-if, pictures, read aloud */
.own{display:flex;flex-direction:column;gap:8px;background:var(--panel-2);border:1.5px dashed var(--line);border-radius:18px;padding:14px}
.own label{font-size:15px;font-weight:600}
.own input{width:100%;min-width:0;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:17px;padding:8px 12px}
.own small{font-size:12px;color:var(--muted)}
.ownrow{display:flex;gap:8px;flex-wrap:wrap}
.ownrow input{flex:1 1 180px;width:auto}
.whatif{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;animation:rise .4s ease both}
.wi{display:flex;flex-direction:column;gap:2px}
.wi+.wi{border-top:1px solid var(--line);padding-top:10px}
.wi b{font-size:15px}
.wi p{font-size:15px;color:var(--muted)}
.pic{font-size:44px;line-height:1.2;text-align:center;letter-spacing:.12em}
.readbtn{margin-left:auto}

/* Library / book */
.library{position:relative;border-radius:26px;overflow:hidden;background:linear-gradient(#24414a,#15272d);border:1px solid var(--line);padding:18px 16px 24px;min-height:340px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.shelves{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-around;padding:10px 0;opacity:.55}
.shelf{display:flex;align-items:flex-end;gap:2px;height:30%;border-bottom:6px solid #3a2a1c;padding:0 8px;overflow:hidden}
.spine{flex:none;border-radius:2px 2px 0 0}
.lamp{position:absolute;top:-40px;left:50%;width:340px;height:340px;transform:translateX(-50%);background:radial-gradient(circle,rgba(236,200,101,.28),transparent 65%);pointer-events:none}
.bookwrap{position:relative;perspective:1100px;width:220px;height:170px;border:0;background:none;padding:0;animation:float 4s ease-in-out infinite}
.book-pages{position:absolute;inset:0;border-radius:6px 14px 14px 6px;background:linear-gradient(90deg,#e7dcc2,#f7f0df 12%,#f7f0df);box-shadow:0 20px 40px -10px rgba(0,0,0,.7);display:grid;place-items:center;overflow:hidden}
.book-pages .glow{font-family:var(--hebrew);font-size:44px;color:#b8862b;opacity:0;transition:opacity 1s .6s}
.book-cover{position:absolute;inset:0;border-radius:6px 14px 14px 6px;background:linear-gradient(135deg,#6e2433,#4a1622);transform-origin:left center;transition:transform 1.4s cubic-bezier(.6,.05,.3,1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px solid #b98a3b;box-shadow:inset 0 0 0 6px #4a1622,inset 0 0 0 8px #b98a3b;backface-visibility:hidden}
.book-cover .heb{font-size:40px;color:var(--etrog)}
.book-cover .lat{font-family:var(--display);font-size:13px;letter-spacing:.3em;color:#e9cf8f}
.open .book-cover{transform:rotateY(-165deg)}
.open .book-pages .glow{opacity:1}
.open.bookwrap{animation:none}
.letters{position:absolute;inset:0;pointer-events:none}
.letters span{position:absolute;font-family:var(--hebrew);color:var(--etrog);font-size:22px;opacity:0;animation:letter 3.2s ease-out forwards}

/* Map */
.map{display:flex;flex-direction:column;gap:0;position:relative;padding:6px 0}
.node{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;width:100%;padding:12px 14px;border-radius:20px;background:transparent;border:1.5px solid transparent;position:relative}
.node:not([disabled]):hover{background:var(--panel)}
.node .disc{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--panel);border:1.5px solid var(--line);font-family:var(--display);font-weight:700}
.node.open .disc{border-color:var(--etrog);box-shadow:0 0 0 6px var(--etrog-soft);animation:pulse 2.4s ease-in-out infinite}
.node.done .disc{background:var(--leaf-soft);border-color:var(--leaf)}
.node[disabled]{opacity:.45;cursor:not-allowed}
.node .nm{font-family:var(--display);font-weight:700;font-size:16px}
.node .ds{font-size:14px;color:var(--muted)}
.node .st{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.node.open .st{color:var(--etrog)}
.node.done .st{color:var(--leaf)}
.map .rail{position:absolute;left:45px;top:40px;bottom:40px;width:2px;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 12px)}
.progress-wrap{display:flex;flex-direction:column;gap:8px}
.pieces{display:flex;gap:6px;flex-wrap:wrap}
.pieces svg{width:34px;height:34px}

/* Minigames */
.arena{position:relative;height:300px;border-radius:22px;background:radial-gradient(circle at 50% 30%,#ffffff,#d9e9df);border:1px solid var(--line);overflow:hidden;touch-action:manipulation}
.item{position:absolute;width:62px;height:62px;border-radius:50%;border:0;background:radial-gradient(circle,rgba(236,200,101,.35),transparent 70%);font-size:34px;display:grid;place-items:center;animation:pop .35s ease both}
.item.got{animation:collect .45s ease forwards;pointer-events:none}
.meters{display:grid;gap:10px}
.meter{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:4px 10px;align-items:center;font-size:14px}
.meter .bar{grid-column:1/-1;height:12px}
.meter.in .bar i{background:var(--pome)}
.meter b{font-variant-numeric:tabular-nums;text-align:right;font-family:var(--display);font-size:13px}
.findgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tile{min-height:62px;border-radius:14px;background:var(--panel);border:1.5px solid var(--line);font-family:var(--hebrew);font-size:24px;direction:rtl;transition:all .25s}
.tile.hit{background:var(--gold);color:var(--etrog-ink);border-color:var(--gold-edge);transform:scale(1.04)}
.tile.no{animation:shake .35s}
.target{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.target .heb{font-size:40px;color:var(--pome);line-height:1}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-width:420px;width:100%;margin:0 auto}
.slot{aspect-ratio:1;max-width:100%;border-radius:16px;border:2px dashed var(--line);background:var(--sunk);display:grid;place-items:center;font-size:30px;color:var(--muted);padding:6px;text-align:center;transition:all .25s}
.slot.filled{border-style:solid;border-color:var(--leaf);background:var(--leaf-soft);color:var(--ink);font-size:13px;line-height:1.2}
.slot.filled em{display:block;font-style:normal;font-size:24px;color:var(--leaf)}
.slot.deco{border-style:solid;border-color:transparent;background:var(--panel-2);font-size:13px;color:var(--muted)}
.slot.hole{border-color:var(--etrog);color:var(--etrog);font-family:var(--display);font-size:13px;animation:pulse 2.4s ease-in-out infinite}
.slot.no{animation:shake .35s}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.piece{min-height:54px;padding:8px 14px;border-radius:14px;background:var(--panel);border:1.5px solid var(--line);display:flex;align-items:center;gap:8px;font-size:15px}
.piece em{font-style:normal;font-size:22px;color:var(--etrog)}
.piece.sel{border-color:var(--etrog);background:var(--panel-2);transform:translateY(-3px)}
.sky{position:relative;height:220px;border-radius:22px;overflow:hidden;background:linear-gradient(#86c1e3,#d9ecf2);transition:background 1.6s ease;border:1px solid var(--line)}
.sky .sun{position:absolute;left:50%;top:40px;width:80px;height:80px;margin-left:-40px;border-radius:50%;background:#f6cf57;box-shadow:0 0 60px 20px rgba(246,207,87,.6);transition:transform 1.6s ease}
.sky .moon{position:absolute;left:50%;top:44px;width:70px;height:70px;margin-left:-35px;border-radius:50%;background:#f1ecd9;box-shadow:inset -16px -6px 0 0 #d8d1b8,0 0 40px 8px rgba(241,236,217,.35);transform:translateY(240px);transition:transform 1.6s .4s ease}
.sky .ground{position:absolute;left:0;right:0;bottom:0;height:46px;background:#2f5a3b;transition:background 1.6s}
.sky .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:0;transition:opacity 1.2s 1s}
.sky.night{background:linear-gradient(#0b1630,#1b2c50)}
.sky.night .sun{transform:translateY(260px)}
.sky.night .moon{transform:none}
.sky.night .ground{background:#16301f}
.sky.night .star{opacity:.85}
.blessing{width:100%;max-width:360px;margin:0 auto;display:block}
.blessing .arm{fill:none;stroke:#e3b089;stroke-width:9;stroke-linecap:round;transition:opacity .8s}
.blessing .crossed{opacity:0}
.blessing.x .straight{opacity:0}
.blessing.x .crossed{opacity:1}
.circles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.circ{aspect-ratio:1;max-width:100%;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px;text-align:center;font-family:var(--display);font-size:clamp(11px,3.2vw,14px);font-weight:700;line-height:1.2;transition:all .3s}
.circ small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.circ.act{border-color:var(--etrog);box-shadow:0 0 0 6px var(--etrog-soft)}
.circ.has{background:var(--leaf-soft);border-color:var(--leaf)}
.toolbox{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.tool{aspect-ratio:1;max-width:100%;border-radius:12px;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center;font-size:clamp(18px,4.5vw,24px);position:relative;filter:grayscale(1);opacity:.45;transition:all .4s}
.tool.on{filter:none;opacity:1;border-color:var(--etrog);background:var(--etrog-soft)}
.tool sup{position:absolute;top:2px;right:4px;font-size:10px;font-family:var(--display);color:var(--etrog)}
.bigboard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;max-width:480px;width:100%;margin:0 auto}

const KEY='koelet-game-v1';

let S=fresh();
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.v===1)S=Object.assign(fresh(),d)}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const $=s=>document.querySelector(s);
const stage=$('#stage');
const esc=s=>String(s).replace(/[&<>"{}]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','{':'&#123;','}':'&#125;'}[c]));
const heroName=()=>S.hero.name.trim()||'Путник';
/* возраст и род */
const young=()=>S.hero.age==='y';
const T=s=>typeof s==='string'?s.replace(/\{([^{}|]*)\|([^{}|]*)\}/g,(_,m,f)=>S.hero.g==='f'?f:m):s;
function R(v){
  if(typeof v==='string')return T(v);
  if(Array.isArray(v))return v.map(R);
  if(v&&typeof v==='object'){if(v.__ag)return R(young()?v.y:v.t);const o={};for(const k in v)o[k]=R(v[k]);return o}
  return v;
}
const byAge=a=>a.filter(s=>typeof s==='function'||!s.age||s.age===(young()?'y':'t'));
const PRO=()=>byAge(PROLOGUE);
const myQualities=()=>[...(S.qualities||[]),...(S.own&&S.own.quality?[S.own.quality]:[])];

/* ---------- sound (off by default) ---------- */
let actx=null;
function tone(f,d,type,vol){if(!S.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.05,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
const sfx={tap:()=>tone(520,.09),good:()=>{tone(660,.16);setTimeout(()=>tone(880,.22),110)},soft:()=>tone(330,.18,'triangle',.04),ach:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.28),i*120))};

/* ---------- progress ---------- */
const lvl=()=>Math.min(LEVELS.length,Math.floor(S.sparks/130)+1);
function addSparks(n,el){
  const before=lvl();S.sparks+=n;
  if(el){const r=el.getBoundingClientRect();const p=document.createElement('div');p.className='plus';p.textContent='+'+n;p.style.left=(r.left+r.width/2-14)+'px';p.style.top=(r.top-6)+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),1200)}
  if(lvl()>before){toast('⬆️','Новый уровень: '+LEVELS[lvl()-1],'Уровень '+lvl());sfx.ach()}
  hud();save();
}
function unlock(id){
  if(S.ach[id])return;S.ach[id]=1;const a=ACHS[id];toast(a[0],'Достижение: '+T(a[1]),T(a[2]));sfx.ach();save();hud();
}
function toast(ic,title,sub){
  const t=document.createElement('div');t.className='toast';t.innerHTML=`<span class="ic">${ic}</span><div><b>${esc(title)}</b><small>${esc(sub)}</small></div>`;

}
function hud(){
  const h=$('#hud');

  const L=lvl(),into=(S.sparks%130)/130*100;
  const pieces=S.done.filter(Boolean).length;
  h.innerHTML=`<span class="pill" title="Искры — твой личный прогресс"><span class="spark"></span><b>${S.sparks}</b></span>
  <div class="lvl"><small>Ур. ${L} · ${LEVELS[L-1]}</small><div class="bar"><i style="width:${L>=LEVELS.length?100:into}%"></i></div></div>
  <span class="pill">🧩 <b>${pieces}/7</b></span><span class="grow"></span>
  <button class="iconbtn" id="snd" aria-pressed="${S.sound}">${S.sound?'🔊 Звук: вкл':'🔈 Звук: выкл'}</button>
  <button class="iconbtn" id="achbtn" aria-label="Достижения">🏅 ${Object.keys(S.ach).length}/6</button>
  ${S.screen==='world'||S.screen==='prologue'?'<button class="iconbtn" id="mapbtn">Карта</button>':''}`;
  $('#snd').onclick=()=>{S.sound=!S.sound;save();hud();sfx.good()};
  $('#achbtn').onclick=showAchs;

}
function achGrid(){return `<div class="achs">${Object.entries(ACHS).map(([k,a])=>`<div class="ach ${S.ach[k]?'':'lock'}"><span class="ic">${a[0]}</span><b>${esc(T(a[1]))}</b><small>${esc(T(a[2]))}</small></div>`).join('')}</div>`}
function showAchs(){

  document.body.appendChild(m);m.onclick=e=>{if(e.target===m||e.target.id==='closeM')m.remove()};
}

/* ---------- step engine ---------- */
function steps(){return S.screen==='prologue'?PRO():byAge(WORLDS[S.w].steps)}
function idx(){const n=steps().length-1;return Math.min(S.screen==='prologue'?S.ps:S.s,n)}
function next(){
  if(S.screen==='prologue'){S.ps=idx()+1;if(S.ps>=PRO().length){return go('map')}}
  else{S.s=idx()+1;if(S.s>=steps().length)return completeWorld()}
  save();render();window.scrollTo({top:0,behavior:'smooth'});
}
function head(){
  const st=steps(),i=idx();
  const label=S.screen==='prologue'?'Пролог · Библиотека':`Мир ${S.w+1} · ${WORLDS[S.w].name}`;
  const rd=young()&&canSpeak()?`<button class="iconbtn readbtn" data-read aria-label="Прочитать вслух">🔈 Послушать</button>`:'';
  return `<div class="scene-head"><span class="kicker">${label}</span>${rd}<div class="dots" aria-label="Шаг ${i+1} из ${st.length}">${st.map((_,k)=>`<i class="${k<i?'done':k===i?'on':''}"></i>`).join('')}</div></div>`;
}
const LETTERS='АБВГДЕЖЗИК';
function optHTML(o,i){return `<button class="opt" data-i="${i}"><span class="ic ${o.ic?'e':''}" aria-hidden="true">${o.ic||LETTERS[i]}</span><span class="ot"><span>${esc(o.t)}</span>${o.s?`<small>${esc(o.s)}</small>`:''}</span></button>`}
function hintBtn(h){return h?`<button class="btn ghost small" data-hint>Мне нужна подсказка</button>`:''}
function wireHint(h,container){
  const b=(container||stage).querySelector('[data-hint]');if(!b)return;
  b.onclick=()=>{if(stage.querySelector('.hint'))return;const d=document.createElement('div');d.className='hint';d.innerHTML='💡 '+h;b.closest('.actions').before(d);sfx.soft()};
}
function toolbox(){if(!(S.screen==='world'&&WORLDS[S.w].tools))return '';
  return `<div class="toolbox" aria-label="Ящик с инструментами">${Object.entries(TOOLS).map(([k,t])=>`<div class="tool ${S.tools[k]?'on':''}" title="${t[1]}">${t[0]}${S.tools[k]>1?`<sup>${S.tools[k]}</sup>`:''}</div>`).join('')}</div>`}

function renderStep(){
  let st=steps()[idx()];if(typeof st==='function')st=st(S);st=R(st);
  S._last=S.screen;
  const fn={talk:rTalk,choice:rChoice,multi:rMulti,quote:rQuote,card:rCard,reveal:rReveal,mini:rMini}[st.type];
  fn(st);
}
function rTalk(st){
  stage.innerHTML=`<section class="scene">${head()}${toolbox()}${sayHTML(st.who,esc(st.text))}<div class="actions"><button class="btn" id="nx">Далее</button></div></section>`;
  $('#nx').onclick=()=>{sfx.tap();next()};
}
function ownHTML(o){return `<div class="own"><label for="ownin">${esc(o.label)}</label><div class="ownrow"><input id="ownin" maxlength="60" autocomplete="off" placeholder="${esc(o.ph||'')}"><button class="btn small" id="ownok" disabled>Это моё</button></div><small>${esc(OWN_NOTE)}</small></div>`}
function rChoice(st){
  const hint=st.hint||(st.neutral?DEF_HINT:null);
  const whatif=st.whatif!==false&&new Set(st.options.map(o=>o.r)).size>1;
  stage.innerHTML=`<section class="scene">${head()}${toolbox()}${sayHTML(st.who,esc(st.text))}
    ${st.q?`<p class="h2" style="font-size:18px">${esc(st.q)}</p>`:''}
    <div class="opts ${st.compact?'compact':''}" role="group">${st.options.map((o,i)=>optHTML(o,i)).join('')}</div>
    ${st.own?ownHTML(st.own):''}
    <div id="out"></div><div id="wil"></div>
    <div class="actions" id="act">${hintBtn(hint)}</div></section>`;
  wireHint(hint);
  const pick=(o,b)=>{
    stage.querySelectorAll('.opt').forEach(x=>{x.disabled=true;x.classList.add(x===b?'picked':'dim')});
    const ow=stage.querySelector('.own');if(ow){ow.querySelectorAll('input,button').forEach(x=>x.disabled=true);if(!o.own)ow.remove()}
    if(st.key){S.ans[st.key]=o.v||o.t;if(st.key==='city')S.city=o.v}
    if(o.help){S.help++;if(S.help>=3)unlock('friend')}
    if(o.insight){S.insight++;if(/^mirror\d/.test(st.key||''))S.mi=(S.mi||0)+1}
    let extra='';
    if(o.tool){S.tools[o.tool]=(S.tools[o.tool]||0)+1;const t=TOOLS[o.tool];extra=`<p><b>${t[0]} В ящике загорелся инструмент: ${t[1]}</b></p>`}
    addSparks(10,b);sfx.good(); // искры одинаковые за любой ответ
    $('#out').innerHTML=`<div class="resp"><span class="who">Что произошло</span><p>${esc(o.r)}</p>${extra}${st.after?`<p class="muted">${esc(st.after)}</p>`:''}</div>`;
    const tb=stage.querySelector('.toolbox');if(tb)tb.outerHTML=toolbox();
    const others=st.options.filter(x=>x!==o&&x.r!==o.r);
    $('#act').innerHTML=`${whatif&&others.length?'<button class="btn ghost small" id="wi">А что было бы, если…?</button>':''}<button class="btn" id="nx">Продолжить</button>`;
    const wi=$('#wi');if(wi)wi.onclick=()=>{sfx.soft();wi.remove();
      $('#wil').innerHTML=`<div class="whatif"><span class="kicker">Другие исходы · твой выбор остаётся твоим</span>${others.map(x=>`<div class="wi"><b>${x.ic?x.ic+' ':''}${esc(x.t)}</b><p>${esc(x.r)}</p></div>`).join('')}</div>`;
      $('#wil').scrollIntoView({behavior:'smooth',block:'nearest'})};
    $('#nx').onclick=()=>{sfx.tap();next()};
    $('#out').scrollIntoView({behavior:'smooth',block:'nearest'});
  };
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(st.options[+b.dataset.i],b));
  if(st.own){const inp=$('#ownin'),ok=$('#ownok');const prev=S.own[st.key]||'';inp.value=prev;ok.disabled=!prev.trim();
    inp.oninput=()=>{ok.disabled=!inp.value.trim()};
    inp.onkeydown=e=>{if(e.key==='Enter'&&!ok.disabled)ok.click()};
    ok.onclick=()=>{const t=inp.value.trim().slice(0,60);if(!t)return;S.own[st.key]=t;save();pick({t,v:t,r:st.own.r||'Записано. Это твои собственные слова.',own:1},ok)}}
}
function rMulti(st){
  let sel=(S[st.key]||[]).filter(x=>st.options.includes(x));
  const ok=st.own&&st.own.key;
  const ownVal=()=>ok?(S.own[ok]||'').trim():'';
  const need=()=>Math.max(1,st.min-(ownVal()?1:0));
  const draw=()=>{
    stage.innerHTML=`<section class="scene">${head()}${sayHTML(M,esc(st.text))}
      <div class="chips">${st.options.map((o,i)=>`<button class="chip ${sel.includes(o)?'on':''}" data-i="${i}" aria-pressed="${sel.includes(o)}">${esc(o)}</button>`).join('')}</div>
      <p class="muted" style="font-size:14px">Выбрано ${sel.length} из ${st.max}</p>
      ${ok?`<div class="own"><label for="ownin">${esc(st.own.label)}</label><input id="ownin" maxlength="40" autocomplete="off" placeholder="${esc(st.own.ph||'')}" value="${esc(S.own[ok]||'')}"><small>${esc(OWN_NOTE)}</small></div>`:''}
      <div class="actions">${hintBtn(st.hint)}<button class="btn" id="nx" ${sel.length<need()?'disabled':''}>Выбрать</button></div></section>`;
    wireHint(st.hint);
    stage.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const o=st.options[+c.dataset.i];
      if(sel.includes(o))sel=sel.filter(x=>x!==o);else if(sel.length<st.max)sel.push(o);else{sel.shift();sel.push(o)}
      sfx.tap();draw()});
    const inp=$('#ownin');if(inp)inp.oninput=()=>{S.own[ok]=inp.value.slice(0,40);save();$('#nx').disabled=sel.length<need()};
    $('#nx').onclick=()=>{S[st.key]=sel;if(ok)S.own[ok]=ownVal();addSparks(15,$('#nx'));sfx.good();next()};
  };draw();
}
function rQuote(st){
  stage.innerHTML=`<section class="scene">${head()}
    <div class="card"><span class="kicker">Цитата · ${esc(st.src)}</span><div class="quote-he" lang="he">${st.he}</div><div id="tr"></div></div>
    <div id="qq"></div>
    <div class="actions" id="act"><button class="btn" id="show">Посмотреть перевод</button></div></section>`;

      <div id="out"></div><div class="actions" id="act">${hintBtn(hint)}</div></section>`;

function strengthMap(s){
  const L=s.lab,q=myQualities();const list=a=>a.map(esc).join(', ');
  const combos=[[/идеи|рисовать|писать/,'создавать что-то новое и полезное для других'],[/объяснять/,'помогать другим понять сложное'],[/слушать/,'быть рядом, когда кому-то трудно'],[/организовывать/,'собирать людей вместе и доводить дело до конца'],[/задачи|мастерить|детали/,'находить решения, которые другие не замечают'],[/спорт/,'заряжать других энергией и командным духом']];
  const joined=(L.can||[]).join(' ');const c=combos.find(x=>x[0].test(joined));
  const parts=[];
  if(q.length)parts.push(`<p>Ты ${T('{отметил|отметила}')} в себе: ${list(q)}.</p>`);
  if(L.can.length)parts.push(`<p>У тебя хорошо получается: ${list(L.can)}.</p>`);
  if(L.like.length)parts.push(`<p>Тебе нравится: ${list(L.like)}.</p>`);
  if(L.need.length)parts.push(`<p>Ты замечаешь, что людям рядом нужно: ${list(L.need)}${L.help.length?'. И ты можешь помочь: '+list(L.help):''}.</p>`);
  parts.push(`<p style="font-size:19px;font-weight:600;color:var(--etrog)">Возможно, одна из твоих сильных сторон — ${c?c[1]:'делать мир вокруг чуть лучше своим способом'}.</p>`);
  if(s.ans.flow)parts.push(`<p class="muted">Попробуй обратить внимание, когда время летит незаметно. Ты ${T('{сказал|сказала}')}: «${esc(s.ans.flow)}». Это стоит исследовать.</p>`);
  parts.push(`<p class="muted" style="font-size:14px">Раввин Шнеор Ашкенази рассказывал: однажды он почти перестал преподавать, ведь его уроки смотрели всего сто-двести человек. И тут он прочитал: «Никогда не прекращай делать то, в чём ты хорош». Он не бросил.</p>`);
  return parts.join('');
}

/* ---------- world flow ---------- */
function completeWorld(){
  const w=WORLDS[S.w];const first=!S.done[S.w];S.done[S.w]=1;
  if(first)S.sparks+=30;
  if(w.ach)unlock(w.ach);
  if(S.done.every(Boolean))unlock('explorer');
  save();
  if(S.w===6){if(!S.finished)S.finished=new Date().toISOString();S.screen='final';unlock('path');save();render();window.scrollTo({top:0});return}
  S.screen='done';save();render();window.scrollTo({top:0});
}
function renderDone(){
  const n=S.done.filter(Boolean).length;
  stage.innerHTML=`<section class="scene"><div class="card reveal"><span class="kicker">Мир ${S.w+1} пройден</span>
    <div style="width:110px;animation:pop .6s ease both">${pieceSvg('var(--gold)')}</div>
    <p class="h2">Деталь «${esc(WORLDS[S.w].name)}» у тебя</p><p class="muted">Собрано деталей: ${n} из 7 · +30 искр</p></div>
    <div class="actions"><button class="btn" id="nx">Продолжить приключение</button></div></section>`;
  $('#nx').onclick=()=>{sfx.tap();go('map')};
}
function renderMap(){
  S._last='map';
  const firstOpen=S.done.findIndex(d=>!d);
  const prologueDone=S.ps>=PRO().length;
  stage.innerHTML=`<section class="scene">
    <span class="kicker">Карта путешествия</span><h2 class="h2">Семь миров книги Коэлет</h2>
    <div class="progress-wrap"><div class="pieces">${S.done.map(d=>pieceSvg(d?'var(--gold)':'none',d?'':'#b3c7bd')).join('')}</div>
    <div class="bar" style="height:10px"><i style="width:${S.done.filter(Boolean).length/7*100}%"></i></div></div>
    ${!prologueDone?`<button class="node open" id="pro"><span class="disc">📖</span><span><span class="st">Сначала</span><br><span class="nm">Пролог: Библиотека</span></span></button>`:''}
    <div class="map"><span class="rail"></span>${WORLDS.map((w,i)=>{const d=S.done[i],o=prologueDone&&(i===firstOpen),lock=!d&&!o;
      return `<button class="node ${d?'done':''} ${o?'open':''}" data-w="${i}" ${lock?'disabled':''}><span class="disc">${d?pieceSvg('var(--gold)'):lock?'🔒':i+1}</span><span style="min-width:0"><span class="st">${d?'Пройден · можно снова':o?'Открыт':'Закрыт'}</span><br><span class="nm">${esc(w.name)}</span><br><span class="ds">${esc(w.desc)}</span></span></button>`}).join('')}</div>
    ${S.done.every(Boolean)?`<div class="actions"><button class="btn" id="fin">Мой Хелек</button></div>`:''}
  </section>`;
  const pro=$('#pro');if(pro)pro.onclick=()=>{S.ps=Math.min(S.ps,PRO().length-1);go('prologue')};
  stage.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{S.w=+b.dataset.w;S.s=0;sfx.good();go('world')});
  const f=$('#fin');if(f)f.onclick=()=>go('final');
}
const CITY_LABEL={wealth:'богатство',fame:'популярность',mind:'ум',power:'власть',beauty:'красивую жизнь',adventure:'приключения'};
function fmtDate(iso){try{return new Date(iso||Date.now()).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}catch(e){return ''}}
function strengthsList(){const q=myQualities();const stem=x=>x.slice(0,6);
  const extra=(S.lab.can||[]).filter(x=>!q.some(y=>stem(y)===stem(x)||y.includes(x.split(' ').pop()))).slice(0,2);return [...q,...extra].slice(0,5)}
function worldReport(){
  const lit=Object.keys(S.tools).map(k=>TOOLS[k][0]+' '+TOOLS[k][1].toLowerCase());
  return R([
    ['Город успеха',S.city?`Ты {выбрал|выбрала} ${CITY_LABEL[S.city]}. Вечером {ответил|ответила}: «${S.ans.evening||'—'}».`:'—','Можно получить всё и всё равно чувствовать, что чего-то не хватает.'],
    ['Пазл',`{Нашёл|Нашла} все 8 слов חֵלֶק. Твои качества: ${myQualities().join(', ')||'—'}.`,'Каждый получает свою деталь, и никто — весь пазл.'],
    ['Зеркало',`Ты {помог|помогла} героям зеркал разобраться, что с ними происходит, и {увидел|увидела}, к чему ведёт каждый выбор.`,'Чужая сильная сторона не делает твою слабее.'],
    ['Эфраим и Менаше',`Когда друг получил награду, ты {решил|решила}: «${S.ans.awardAct||'—'}».`,'Если у другого есть свой дар, твой от этого не исчезает.'],
    ['Мастерская',lit.length?`Загорелись инструменты: ${lit.join(', ')}.`:'Инструменты ещё ждут тебя.','У каждого свои инструменты. Важно понять, для чего они тебе.'],
    ['Лаборатория Хелека',`Время летит незаметно, когда: ${(S.ans.flow||'—').toLowerCase()}. Получается: ${(S.lab.can||[]).join(', ')||'—'}.`,'Где встречаются «умею», «люблю» и «нужно другим», там может быть твоя доля.'],
    ['Одна деталь',`Твой шаг на неделю: ${(S.ans.weekly||'—').toLowerCase()}.`,'Тебе не нужно собрать весь мир. Нужно найти свою деталь.']
  ]);
}
function wrapLines(ctx,text,maxW){const words=text.split(' ');const lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}if(cur)lines.push(cur);return lines}
async function drawCertificate(){
  const W=1600,H=1130,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  try{await Promise.all(['800 60px Unbounded','700 40px Unbounded','400 30px Onest','500 30px Onest','700 60px "Frank Ruhl Libre"'].map(f=>document.fonts.load(f)))}catch(e){}
  const D='Unbounded, "Trebuchet MS", sans-serif',B='Onest, "Segoe UI", sans-serif',HB='"Frank Ruhl Libre", serif';
  x.fillStyle='#fbfdfb';x.fillRect(0,0,W,H);
  // corner puzzle motifs
  const piece=(px,py,sz,col,rot)=>{x.save();x.translate(px,py);x.rotate(rot);x.scale(sz/100,sz/100);x.translate(-50,-50);x.fillStyle=col;x.fill(new Path2D(PIECE));x.restore()};
  [[90,90,'#9fd0ae',0],[190,70,'#f2be3d',.3],[70,190,'#f2b8c2',-.2],[W-90,H-90,'#bcd6ea',0],[W-190,H-70,'#9fd0ae',.4],[W-70,H-190,'#f2be3d',-.3]].forEach(p=>piece(p[0],p[1],110,p[2],p[3]));
  x.strokeStyle='#c9951f';x.lineWidth=6;x.strokeRect(40,40,W-80,H-80);x.lineWidth=2;x.strokeRect(58,58,W-116,H-116);
  x.textAlign='center';x.fillStyle='#a2700a';x.font=`500 26px ${B}`;x.fillText('П Р И К Л Ю Ч Е Н И Е   « Т А Й Н А   К О Э Л Е Т А »',W/2,170);
  x.fillStyle='#17282e';x.font=`800 92px ${D}`;x.fillText('СЕРТИФИКАТ',W/2,280);
  x.fillStyle='#566d67';x.font=`400 32px ${B}`;x.fillText('вручается',W/2,350);
  x.fillStyle='#2f7d4a';let fs=86;x.font=`700 ${fs}px ${D}`;const nm=heroName();while(x.measureText(nm).width>1100&&fs>40){fs-=4;x.font=`700 ${fs}px ${D}`}x.fillText(nm,W/2,450);
  x.fillStyle='#17282e';x.font=`400 34px ${B}`;
  wrapLines(x,'за прохождение всех семи миров книги Коэлет и поиск своей детали большого пазла',1150).forEach((l,i)=>x.fillText(l,W/2,530+i*46));
  const st=strengthsList();
  if(st.length){x.fillStyle='#566d67';x.font=`500 28px ${B}`;x.fillText('СИЛЬНЫЕ СТОРОНЫ',W/2,660);
    x.fillStyle='#17282e';x.font=`500 32px ${B}`;wrapLines(x,st.join(' · '),1200).slice(0,2).forEach((l,i)=>x.fillText(l,W/2,706+i*44))}
  x.fillStyle='#566d67';x.font=`400 28px ${B}`;x.fillText(`Уровень ${lvl()} · ${LEVELS[lvl()-1]}  ·  ${S.sparks} искр  ·  7 из 7 деталей  ·  ${Object.keys(S.ach).length} из 6 достижений`,W/2,820);
  // seal
  x.save();x.translate(W/2,950);x.fillStyle='#f2be3d';x.beginPath();for(let i=0;i<32;i++){const r=i%2?74:84,a=i/32*Math.PI*2;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.fill();
  x.fillStyle='#fbfdfb';x.beginPath();x.arc(0,0,62,0,Math.PI*2);x.fill();x.fillStyle='#c8445b';x.font=`700 50px ${HB}`;x.fillText('חֵלֶק',0,16);x.restore();
  x.textAlign='left';x.fillStyle='#17282e';x.font=`500 28px ${B}`;x.fillText(fmtDate(S.finished),190,960);
  x.strokeStyle='#b3c7bd';x.lineWidth=2;x.beginPath();x.moveTo(190,975);x.lineTo(560,975);x.stroke();
  x.fillStyle='#566d67';x.font=`400 22px ${B}`;x.fillText('дата',190,1005);
  x.textAlign='right';x.fillStyle='#17282e';x.font=`italic 500 32px ${B}`;x.fillText('Хранитель библиотеки',W-190,960);
  x.beginPath();x.moveTo(W-560,975);x.lineTo(W-190,975);x.stroke();
  x.fillStyle='#566d67';x.font=`400 22px ${B}`;x.fillText('подпись',W-190,1005);
  x.textAlign='center';x.font=`400 20px ${B}`;x.fillText('По мотивам урока раввина Шнеора Ашкенази «Тайна книги Коэлет»',W/2,1062);
  return c.toDataURL('image/png');
}
function renderFinal(){
  S._last='final';
  const strengths=strengthsList();
  if(S.phrase===null){S.phrase=S.insight>=3?0:S.help>=3?2:1;save()}
  const rep=worldReport();
  stage.innerHTML=`<section class="scene final-grid">
    <div class="final-hero"><span class="kicker">Финал · ${esc(heroName())}</span><h1 class="h1">Твой <span style="color:var(--pome)">Хелек</span></h1>
    <p class="lead">Ты ${T('{обнаружил|обнаружила}')} несколько своих сильных сторон. Это не готовый ответ на всю жизнь. Это подсказки, которые можно исследовать дальше.</p></div>

    <article class="card cert-card"><div class="cert-head"><span class="kicker">Сертификат</span><span class="muted" style="font-size:14px">${fmtDate(S.finished)}</span></div>
      <div class="field"><label for="certname">Имя на сертификате</label><input id="certname" maxlength="24" autocomplete="off" placeholder="Путник" value="${esc(S.hero.name)}"></div>
      <div class="cert-frame" id="cert"><p class="muted">Готовим сертификат…</p></div>
      <p class="muted" style="font-size:14px">Чтобы сохранить сертификат, нажми на картинку и удерживай её. На компьютере нажми на неё правой кнопкой и выбери «Сохранить изображение».</p></article>

    <div class="stats">
      <div class="statcard"><span class="k">Искры</span><b>${S.sparks}</b></div>
      <div class="statcard"><span class="k">Уровень</span><b>${lvl()}</b><small>${LEVELS[lvl()-1]}</small></div>
      <div class="statcard"><span class="k">Детали пазла</span><b>${S.done.filter(Boolean).length}/7</b></div>
      <div class="statcard"><span class="k">Достижения</span><b>${Object.keys(S.ach).length}/6</b></div>
    </div>

    <div class="duo">
      <div class="card"><span class="kicker">Твои сильные стороны</span><div class="strengths">${strengths.map(x=>`<span>${esc(x)}</span>`).join('')||'<span>ещё впереди</span>'}</div></div>
      <div class="card"><span class="kicker">Твой следующий шаг</span><p class="h2" style="font-size:20px">${esc(S.ans.weekly||'Выбрать свой шаг')}</p><p class="muted">На этой неделе. Маленький, но настоящий.</p></div>
    </div>

    <div class="card"><span class="kicker">Твоя фраза</span><p class="phrase" id="ph">${esc(T(PHRASES[S.phrase]))}</p><div class="actions"><button class="btn ghost small" id="nph">Другая фраза</button><button class="btn ghost small" id="cp">Скопировать</button></div></div>

    <section class="report"><div><span class="kicker">Отчёт о прохождении</span><h2 class="h2">Путь по семи мирам</h2>
      <p class="muted" style="font-size:15px">Начало: ${fmtDate(S.started)} · Финиш: ${fmtDate(S.finished)}</p></div>
      <div class="rgrid">${rep.map((r,i)=>`<article class="rcard"><div class="rtop"><span class="rnum">${i+1}</span><b>${esc(r[0])}</b></div><p>${esc(r[1])}</p><p class="disc"><span>Открытие</span>${esc(r[2])}</p></article>`).join('')}</div>
    </section>

    <div class="card"><span class="kicker">Разгадка тайны Коэлета</span><p>Царь Шломо проверил богатство, мудрость и славу и назвал всё это паром. Но в его книге 8 раз звучит слово <b class="heb" lang="he">חֵלֶק</b>, «доля». Счастье не в том, чтобы собрать весь пазл. Оно в том, чтобы найти свою деталь и радоваться ей.</p></div>

    <div class="card"><span class="kicker">Достижения</span>${achGrid()}</div>

    <div class="card talk-card"><span class="kicker">Для разговора дома или в классе</span>
      <ol><li>Что у тебя получается так, что время летит незаметно?</li><li>Когда ты последний раз ${T('{радовался|радовалась}')} чужому успеху? Что при этом чувствовал?</li><li>Кому рядом с тобой сейчас нужно то, что умеешь ты?</li><li>Какую «деталь» в нашей семье или классе можешь добавить только ты?</li></ol></div>

    <div class="actions"><button class="btn" id="map">Вернуться на карту</button><button class="btn ghost" id="again">Пройти заново</button></div>
    <div id="conf"></div>
    <p class="foot">Для взрослых: игра основана на уроке раввина Шнеора Ашкенази «Тайна книги Коэлет». Источники: Коэлет 1:2, 3:22, 5:17–18, 9:9; Пиркей Авот 2:16, 4:1; Берешит 30:1, 48:14–20; Шмуэль I 18:7–9; Эстер 4:14; Бава Батра 21а, 75а. Два режима текстов: 8–11 и 12–15 лет. Ответы ребёнка хранятся только в этом браузере.</p>
  </section>`;
  let tok=0;const paint=async()=>{const my=++tok;const url=await drawCertificate();if(my!==tok||!$('#cert'))return;$('#cert').innerHTML=`<img src="${url}" alt="Сертификат о прохождении приключения «Тайна Коэлета» для ${esc(heroName())}">`};
  paint();
  let tm;$('#certname').oninput=e=>{S.hero.name=e.target.value;save();clearTimeout(tm);tm=setTimeout(paint,350)};
  $('#nph').onclick=()=>{S.phrase=(S.phrase+1)%PHRASES.length;save();$('#ph').textContent=T(PHRASES[S.phrase]);sfx.tap()};
  $('#cp').onclick=()=>{const t=T(PHRASES[S.phrase]);const ok=()=>{$('#cp').textContent='Скопировано'};
    try{navigator.clipboard.writeText(t).then(ok,()=>{selectText($('#ph'))})}catch(e){selectText($('#ph'))}};
  $('#map').onclick=()=>go('map');
  $('#again').onclick=()=>{$('#conf').innerHTML=`<div class="confirm"><p>Начать всё сначала? Прогресс будет стёрт.</p><div class="actions"><button class="btn small" id="yes">Да</button><button class="btn ghost small" id="no">Отмена</button></div></div>`;
    $('#yes').onclick=()=>{const snd=S.sound;S=fresh();S.sound=snd;save();go('create')};$('#no').onclick=()=>{$('#conf').innerHTML=''}};
}
function selectText(el){try{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}}

/* ---------- озвучка (для младших) ---------- */
function canSpeak(){try{return 'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined'}catch(e){return false}}
function stopReading(){try{if(canSpeak())speechSynthesis.cancel()}catch(e){}const b=stage.querySelector('[data-read]');if(b)b.textContent='🔈 Послушать'}
function readAloud(btn){
  if(!canSpeak())return;
  if(speechSynthesis.speaking){stopReading();return}
  const sel='.bubble .txt, .card .h2, .card p, .reveal .h1, .resp p, .wi b, .wi p, .lead, p.h2, .opt:not(.dim) .ot > span';
  const txt=[...stage.querySelectorAll(sel)].filter(el=>!el.closest('[lang="he"]')).map(el=>el.textContent.trim()).filter(Boolean).join('. ');
  if(!txt)return;
  const u=new SpeechSynthesisUtterance(txt.replace(/[«»]/g,''));u.lang='ru-RU';u.rate=.95;
  const v=speechSynthesis.getVoices().find(x=>/^ru/i.test(x.lang));if(v)u.voice=v;
  u.onend=u.onerror=()=>{if(btn&&btn.isConnected)btn.textContent='🔈 Послушать'};
  btn.textContent='⏹ Стоп';speechSynthesis.speak(u);
}
stage.addEventListener('click',e=>{const b=e.target.closest('[data-read]');if(b)readAloud(b)});

/* ---------- boot ---------- */
function start(data){
  load();
  if(data&&data.state&&data.state.v===1)S=Object.assign(fresh(),data.state);
  if(S.screen!=='title'&&S.screen!=='create'){S._last=S.screen;S.screen='title'}
  render();
}
window.claude?.hot?.snapshot?.(()=>({state:S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
